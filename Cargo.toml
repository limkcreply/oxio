[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# first-light deps: anyhow (app errors), toml + dirs
# (config load/save + XDG path), clap (CLI). Named, lockfile-respecting.
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
toml = "0.8"
dirs = "5"
clap = { version = "4", features = ["derive"] }
reedline = "0.38"  # commodity line editor (history/editing) for the REPL
