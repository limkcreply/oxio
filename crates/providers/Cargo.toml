[package]
name = "providers"
description = "Wire adapters + Provider implementations for oxio (chat_completions first)."
version.workspace = true
edition.workspace = true
license.workspace = true

# named deps for the providers vertical: reqwest (HTTP),
# async-stream (real SSE streaming). Exact pins, lockfile-respecting.
[dependencies]
oxio-core = { path = "../oxio-core" }
async-trait.workspace = true
futures.workspace = true
serde_json.workspace = true
reqwest = { version = "=0.12.9", default-features = false, features = ["json", "stream", "rustls-tls"] }
async-stream = "=0.3.6"

[dev-dependencies]
tokio.workspace = true

[[example]]
name = "probe"
